<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUWARO（スワロ）— 企画書</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.4/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <style>
      /* ========== Reset & Base ========== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --green-900: #1e3932;
        --green-700: #00704a;
        --green-500: #1c9d6f;
        --green-200: #b8ded0;
        --green-100: #d4e9e2;
        --green-50: #edf5f0;
        --cream: #f9f6f1;
        --cream-dark: #f0ebe3;
        --gold: #c8a97e;
        --gold-light: #e8d9bf;
        --white: #ffffff;
        --text: #2d2d2d;
        --text-light: #6b6b6b;
        --text-lighter: #999999;
        --border: #e5e5e5;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.12);
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 20px;
        --radius-xl: 28px;
      }

      html {
        scroll-behavior: smooth;
        font-size: 16px;
      }

      body {
        font-family:
          'Noto Sans JP',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: var(--text);
        background: var(--white);
        line-height: 1.8;
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
      }

      /* ========== Typography ========== */
      h1,
      h2,
      h3,
      h4 {
        color: var(--green-900);
        line-height: 1.4;
        font-weight: 700;
      }
      h2 {
        font-size: 1.8rem;
        margin-bottom: 1rem;
      }
      h3 {
        font-size: 1.25rem;
        margin-bottom: 0.75rem;
      }
      p {
        margin-bottom: 1rem;
      }
      strong {
        font-weight: 700;
      }
      a {
        color: var(--green-700);
        text-decoration: none;
      }

      /* ========== Navigation ========== */
      .nav {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 0 2rem;
      }
      .nav-inner {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 56px;
      }
      .nav-logo {
        font-weight: 900;
        font-size: 1.1rem;
        color: var(--green-900);
        letter-spacing: 0.08em;
      }
      .nav-links {
        display: flex;
        gap: 0.25rem;
      }
      .nav-links a {
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--text-light);
        padding: 0.4rem 0.75rem;
        border-radius: 999px;
        transition: all 0.2s;
      }
      .nav-links a:hover {
        color: var(--green-700);
        background: var(--green-50);
      }

      @media (max-width: 768px) {
        .nav-links {
          display: none;
        }
      }

      /* ========== Layout ========== */
      .section {
        padding: 5rem 2rem;
      }
      .section--alt {
        background: var(--cream);
      }
      .section-inner {
        max-width: 900px;
        margin: 0 auto;
      }
      .section-wide {
        max-width: 1100px;
        margin: 0 auto;
      }

      .section-label {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--green-700);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 0.75rem;
      }
      .section-label i {
        width: 18px;
        height: 18px;
      }

      /* ========== Hero ========== */
      .hero {
        background: linear-gradient(160deg, var(--green-900) 0%, #2d5a4b 100%);
        color: var(--white);
        padding: 6rem 2rem 5rem;
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .hero::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background:
          radial-gradient(circle at 30% 70%, rgba(0, 112, 74, 0.3) 0%, transparent 50%),
          radial-gradient(circle at 70% 30%, rgba(200, 169, 126, 0.15) 0%, transparent 50%);
      }
      .hero-inner {
        position: relative;
        z-index: 1;
        max-width: 700px;
        margin: 0 auto;
      }
      .hero-badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 500;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 0.35rem 1rem;
        border-radius: 999px;
        margin-bottom: 2rem;
        letter-spacing: 0.05em;
      }
      .hero h1 {
        font-size: 3.5rem;
        font-weight: 900;
        color: var(--white);
        letter-spacing: 0.15em;
        margin-bottom: 0.5rem;
      }
      .hero-sub {
        font-size: 0.95rem;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 2rem;
        letter-spacing: 0.02em;
      }
      .hero-tagline {
        font-size: 1.35rem;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.9);
        line-height: 1.7;
        margin-bottom: 2.5rem;
      }
      .hero-meta {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.5);
      }

      /* ========== Cards ========== */
      .card {
        background: var(--white);
        border-radius: var(--radius-md);
        padding: 1.75rem;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border);
      }

      /* ========== Quote / Blockquote ========== */
      .experience-quote {
        background: var(--cream);
        border-left: 4px solid var(--gold);
        border-radius: 0 var(--radius-md) var(--radius-md) 0;
        padding: 1.5rem 2rem;
        font-size: 0.95rem;
        color: var(--text);
        line-height: 2;
        margin-bottom: 1.5rem;
      }
      .experience-result {
        font-size: 0.95rem;
        color: var(--text-light);
        padding-left: 1.5rem;
        border-left: 3px solid var(--border);
        margin-bottom: 2rem;
      }

      /* ========== Tables ========== */
      .styled-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
        margin: 1.5rem 0;
      }
      .styled-table thead th {
        background: var(--green-900);
        color: var(--white);
        padding: 0.85rem 1.25rem;
        text-align: left;
        font-weight: 500;
        font-size: 0.82rem;
        letter-spacing: 0.03em;
      }
      .styled-table thead th:first-child {
        border-radius: var(--radius-sm) 0 0 0;
      }
      .styled-table thead th:last-child {
        border-radius: 0 var(--radius-sm) 0 0;
      }
      .styled-table tbody td {
        padding: 0.85rem 1.25rem;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      .styled-table tbody tr:last-child td {
        border-bottom: none;
      }
      .styled-table tbody tr:nth-child(even) {
        background: var(--cream);
      }

      .risk-badge {
        display: inline-block;
        white-space: nowrap;
        font-size: 0.72rem;
        font-weight: 700;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        letter-spacing: 0.03em;
      }
      .risk-badge--tech {
        background: #e3f0ff;
        color: #1a5fb4;
      }
      .risk-badge--supply {
        background: #e2f1ea;
        color: #1c7a54;
      }
      .risk-badge--demand {
        background: #f3e8f9;
        color: #813d9c;
      }
      .risk-badge--rev {
        background: #fff3e0;
        color: #c66900;
      }

      /* ========== Principle Cards ========== */
      .principles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.25rem;
        margin: 2rem 0;
      }
      @media (max-width: 768px) {
        .principles {
          grid-template-columns: 1fr;
        }
      }
      .principle {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 1.5rem;
        text-align: center;
      }
      .principle-num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        background: var(--green-100);
        color: var(--green-700);
        font-weight: 700;
        font-size: 0.9rem;
        border-radius: 50%;
        margin-bottom: 0.75rem;
      }
      .principle h4 {
        font-size: 0.95rem;
        margin-bottom: 0.5rem;
      }
      .principle p {
        font-size: 0.82rem;
        color: var(--text-light);
        margin-bottom: 0;
        line-height: 1.7;
      }

      /* ========== Insight / Highlight ========== */
      .insight-box {
        background: linear-gradient(135deg, var(--green-900) 0%, #2d5a4b 100%);
        color: var(--white);
        border-radius: var(--radius-lg);
        padding: 2.5rem;
        margin: 2rem 0;
      }
      .insight-box p {
        color: rgba(255, 255, 255, 0.85);
      }

      /* ========== Before/After Table ========== */
      .ba-table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.5rem 0;
      }
      .ba-table td {
        padding: 1.25rem 1.5rem;
        font-size: 0.95rem;
        vertical-align: middle;
      }
      .ba-table tr {
        border-bottom: 1px solid var(--border);
      }
      .ba-table tr:last-child {
        border-bottom: none;
      }
      .ba-table .ba-before {
        background: var(--cream);
        color: var(--text-light);
        width: 45%;
      }
      .ba-table .ba-arrow {
        text-align: center;
        width: 10%;
        color: var(--green-700);
      }
      .ba-table .ba-after {
        background: var(--green-50);
        color: var(--green-900);
        font-weight: 700;
        width: 45%;
      }

      /* ========== Timeline / Roadmap ========== */
      .roadmap {
        display: flex;
        align-items: flex-start;
        gap: 0;
        margin: 2rem 0;
        overflow-x: auto;
        padding-bottom: 1rem;
      }
      .roadmap-step {
        flex: 1;
        min-width: 180px;
        text-align: center;
        position: relative;
        padding: 0 0.5rem;
      }
      .roadmap-step::after {
        content: '';
        position: absolute;
        top: 22px;
        right: -50%;
        width: 100%;
        height: 2px;
        background: var(--green-200);
      }
      .roadmap-step:last-child::after {
        display: none;
      }
      .roadmap-dot {
        width: 44px;
        height: 44px;
        background: var(--green-100);
        border: 3px solid var(--green-700);
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 0.85rem;
        color: var(--green-700);
        margin-bottom: 0.75rem;
        position: relative;
        z-index: 1;
      }
      .roadmap-step h4 {
        font-size: 0.85rem;
        margin-bottom: 0.35rem;
      }
      .roadmap-step p {
        font-size: 0.78rem;
        color: var(--text-light);
        line-height: 1.6;
      }

      /* ========== Callout ========== */
      .callout {
        display: flex;
        align-items: flex-start;
        gap: 1rem;
        padding: 1.25rem 1.5rem;
        border-radius: var(--radius-md);
        margin: 1.5rem 0;
        font-size: 0.9rem;
      }
      .callout--info {
        background: var(--green-50);
        border: 1px solid var(--green-200);
        color: var(--green-900);
      }
      .callout--warn {
        background: #fff8e1;
        border: 1px solid var(--gold-light);
        color: #5d4e37;
      }
      .callout i {
        flex-shrink: 0;
        margin-top: 0.1rem;
      }

      /* ========== Bullet List ========== */
      .check-list {
        list-style: none;
        margin: 1rem 0;
      }
      .check-list li {
        display: flex;
        align-items: flex-start;
        gap: 0.6rem;
        padding: 0.4rem 0;
        font-size: 0.9rem;
      }
      .check-list li i {
        flex-shrink: 0;
        color: var(--green-700);
        margin-top: 0.25rem;
        width: 16px;
        height: 16px;
      }

      /* ========== Phone Prototype ========== */
      .proto-section {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4rem;
        flex-wrap: wrap;
        padding: 3rem 0;
      }
      .proto-text {
        max-width: 380px;
      }
      .proto-text h3 {
        font-size: 1.5rem;
        margin-bottom: 1rem;
      }
      .proto-text p {
        color: var(--text-light);
        font-size: 0.92rem;
      }
      .proto-hint {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.78rem;
        color: var(--text-lighter);
        margin-top: 1rem;
        background: var(--cream);
        padding: 0.5rem 1rem;
        border-radius: 999px;
      }

      .phone {
        width: 320px;
        height: 640px;
        background: #1a1a1a;
        border-radius: 44px;
        padding: 12px;
        box-shadow:
          var(--shadow-lg),
          0 0 0 2px #333;
        position: relative;
        flex-shrink: 0;
      }
      .phone-screen {
        width: 100%;
        height: 100%;
        background: var(--white);
        border-radius: 34px;
        overflow: hidden;
        position: relative;
      }
      .phone-status {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        font-size: 12px;
        font-weight: 600;
        z-index: 10;
        color: var(--green-900);
      }
      .phone-status-icons {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .phone-dynamic-island {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 28px;
        background: #1a1a1a;
        border-radius: 20px;
        z-index: 20;
      }
      .phone-home-indicator {
        position: absolute;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 4px;
        background: #ccc;
        border-radius: 4px;
        z-index: 10;
      }

      .proto-screen {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 28px 40px;
        opacity: 0;
        transition: opacity 0.35s ease;
        pointer-events: none;
      }
      .proto-screen.active {
        opacity: 1;
        pointer-events: auto;
      }

      .screen-home {
        background: var(--white);
      }
      .screen-home .logo-mark {
        width: 64px;
        height: 64px;
        background: var(--green-700);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--white);
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 0.05em;
        margin-bottom: 16px;
        box-shadow: 0 4px 16px rgba(0, 112, 74, 0.3);
      }
      .screen-home h2 {
        font-size: 18px;
        color: var(--green-900);
        margin-bottom: 6px;
        text-align: center;
      }
      .screen-home .tagline {
        font-size: 13px;
        color: var(--text-light);
        margin-bottom: 32px;
        text-align: center;
      }
      .screen-home .location {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text-light);
        margin-bottom: 24px;
      }
      .screen-home .location i {
        width: 16px;
        height: 16px;
        color: var(--green-700);
      }

      .btn-proto {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: var(--green-700);
        color: var(--white);
        border: none;
        border-radius: 14px;
        padding: 14px 40px;
        font-size: 15px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.15s;
        width: 100%;
      }
      .btn-proto:hover {
        background: var(--green-900);
      }
      .btn-proto:active {
        transform: scale(0.97);
      }
      .btn-proto--ghost {
        background: transparent;
        color: var(--green-700);
        border: none;
        padding: 8px 16px;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
        border-radius: 8px;
        transition: background 0.2s;
      }
      .btn-proto--ghost:hover {
        background: var(--green-50);
      }

      .screen-count {
        background: var(--white);
      }
      .screen-count h2 {
        font-size: 20px;
        color: var(--green-900);
        margin-bottom: 32px;
      }
      .count-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        width: 100%;
        margin-bottom: 32px;
      }
      .count-btn {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 700;
        color: var(--green-900);
        background: var(--green-50);
        border: 2px solid transparent;
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }
      .count-btn:hover,
      .count-btn.selected {
        border-color: var(--green-700);
        background: var(--green-100);
      }

      .screen-search {
        background: var(--green-50);
      }
      .search-pulse {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--green-700);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        position: relative;
      }
      .search-pulse i {
        color: var(--white);
        width: 32px;
        height: 32px;
      }
      .search-pulse::before,
      .search-pulse::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid var(--green-700);
        animation: pulse-ring 1.8s ease-out infinite;
      }
      .search-pulse::after {
        animation-delay: 0.6s;
      }
      @keyframes pulse-ring {
        0% {
          transform: scale(1);
          opacity: 0.6;
        }
        100% {
          transform: scale(2.2);
          opacity: 0;
        }
      }
      .screen-search p {
        font-size: 14px;
        color: var(--green-900);
        font-weight: 500;
        text-align: center;
      }
      .search-sub {
        font-size: 12px !important;
        color: var(--text-light) !important;
        font-weight: 400 !important;
        margin-top: 8px;
      }

      .screen-feedback {
        background: var(--white);
      }
      .screen-feedback h2 {
        font-size: 20px;
        color: var(--green-900);
        margin-bottom: 8px;
      }
      .screen-feedback .sub {
        font-size: 13px;
        color: var(--text-light);
        margin-bottom: 32px;
      }
      .feedback-btns {
        display: flex;
        gap: 12px;
        width: 100%;
      }
      .feedback-btn {
        flex: 1;
        padding: 16px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: none;
        cursor: pointer;
        font-family: inherit;
        transition: transform 0.15s;
      }
      .feedback-btn:active {
        transform: scale(0.96);
      }
      .feedback-btn--yes {
        background: var(--green-700);
        color: var(--white);
      }
      .feedback-btn--no {
        background: var(--cream);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .screen-success {
        background: var(--white);
      }
      .success-check {
        width: 72px;
        height: 72px;
        background: var(--green-100);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      .success-check i {
        color: var(--green-700);
        width: 36px;
        height: 36px;
      }
      .screen-success h2 {
        font-size: 20px;
        color: var(--green-900);
        margin-bottom: 8px;
      }
      .screen-success p {
        font-size: 13px;
        color: var(--text-light);
        text-align: center;
        margin-bottom: 32px;
      }

      /* Screen: QR Scan */
      .screen-qr {
        background: var(--white);
      }
      .screen-qr h2 {
        font-size: 18px;
        color: var(--green-900);
        margin-bottom: 8px;
      }
      .screen-qr > p {
        font-size: 13px;
        color: var(--text-light);
        text-align: center;

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback } = React

      /* ===== Lucide hydration hook ===== */
      const useLucide = () => {
        useEffect(() => {
          if (typeof lucide !== 'undefined') lucide.createIcons()
        })
      }

      /* ===== Scroll reveal hook（控えめなフェードアップ） ===== */
      const useScrollReveal = () => {
        useEffect(() => {
          const els = document.querySelectorAll('.reveal:not(.is-visible)')
          const reduce =
            window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
          if (reduce || typeof IntersectionObserver === 'undefined') {
            els.forEach((el) => el.classList.add('is-visible'))
            return
          }
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((e) => {
                if (e.isIntersecting) {
                  e.target.classList.add('is-visible')
                  io.unobserve(e.target)
                }
              })
            },
            { threshold: 0.12, rootMargin: '0px 0px -8% 0px' }
          )
          els.forEach((el) => io.observe(el))
          return () => io.disconnect()
        }, [])
      }

      /* ===== Figure（イラスト） ===== */
      const Figure = ({ src, alt, caption }) => (
        <figure className="figure">
          <img src={src} alt={alt || ''} loading="lazy" />
          {caption && <figcaption>{caption}</figcaption>}
        </figure>
      )

      /* ===== CycleDiagram（悪循環 / 好循環）縦フロー＋戻り線 ===== */
      const CycleDiagram = ({ steps, loop, tone }) => (
        <div className={'cycle cycle--' + tone}>
          <div className="cycle-track">
            <div className="cycle-rail" />
            <div className="cycle-list">
              {steps.map((s, i) => (
                <React.Fragment key={i}>
                  <div className="cycle-node">{s}</div>
                  {i < steps.length - 1 && (
                    <div className="cycle-down">
                      <i data-lucide="chevron-down" />
                    </div>
                  )}
                </React.Fragment>
              ))}
            </div>
          </div>
          <div className="cycle-caption">
            <i data-lucide={tone === 'good' ? 'rotate-cw' : 'rotate-ccw'} />
            {loop}
          </div>
        </div>
      )

      /* ===== BizDiagram（VACAN × カフェ） ===== */
      const BizDiagram = () => (
        <div className="biz">
          <div className="biz-side">
            <div className="biz-ic">V</div>
            <span>VACAN</span>
          </div>
          <div className="biz-arrows">
            <div className="biz-arrow to-right">
              <span className="lbl">① 混雑を見える化（従来）</span>
            </div>
            <div className="biz-arrow to-right hl">
              <span className="lbl">② 空席に送客（SUWARO で追加）</span>
            </div>
            <div className="biz-arrow to-left">

                <ul className="check-list">
