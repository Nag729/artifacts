<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUWARO（スワロ）— 企画書</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300704a'/><text x='50' y='72' font-family='system-ui' font-size='62' font-weight='900' fill='white' text-anchor='middle'>S</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.4/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/content.css" />
    <link rel="stylesheet" href="css/diagram.css" />
    <link rel="stylesheet" href="css/prototype.css" />
    <link rel="stylesheet" href="css/motion.css" />
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback } = React

      /* ===== Lucide hydration hook ===== */
      const useLucide = () => {
        useEffect(() => {
          if (typeof lucide !== 'undefined') lucide.createIcons()
        })
      }

      /* ===== Scroll reveal hook（控えめなフェードアップ） ===== */
      const useScrollReveal = () => {
        useEffect(() => {
          const els = document.querySelectorAll('.reveal:not(.is-visible)')
          const reduce =
            window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
          if (reduce || typeof IntersectionObserver === 'undefined') {
            els.forEach((el) => el.classList.add('is-visible'))
            return
          }
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((e) => {
                if (e.isIntersecting) {
                  e.target.classList.add('is-visible')
                  io.unobserve(e.target)
                }
              })
            },
            { threshold: 0.12, rootMargin: '0px 0px -8% 0px' }
          )
          els.forEach((el) => io.observe(el))
          return () => io.disconnect()
        }, [])
      }

      /* ===== Figure（イラスト） ===== */
      const Figure = ({ src, alt, caption }) => (
        <figure className="figure">
          <img src={src} alt={alt || ''} loading="lazy" />
          {caption && <figcaption>{caption}</figcaption>}
        </figure>
      )

      /* ===== ConceptMovieButton（コンセプトムービーを全画面で流す） =====
         ページ内に動画を置くとヒーローや本文の流れが途切れるので、動画は隠しておき、押したときだけ全画面で再生する */
      const ConceptMovieButton = () => {
        const videoRef = useRef(null)

        useEffect(() => {
          const video = videoRef.current
          const rewindOnExit = () => {
            if (document.fullscreenElement === video) return
            video.pause()
            video.currentTime = 0
          }
          const exitOnEnd = () => {
            if (document.fullscreenElement === video) document.exitFullscreen()
          }
          document.addEventListener('fullscreenchange', rewindOnExit)
          video.addEventListener('ended', exitOnEnd)
          return () => {
            document.removeEventListener('fullscreenchange', rewindOnExit)
            video.removeEventListener('ended', exitOnEnd)
          }
        }, [])

        const play = () => {
          const video = videoRef.current
          // iOS Safari は要素の全画面 API を持たず、動画専用の webkitEnterFullscreen だけがある
          if (video.requestFullscreen) video.requestFullscreen()
          else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen()
          video.play()
        }

        return (
          <>
            <button type="button" className="hero-movie" onClick={play}>
              <i data-lucide="play" /> コンセプトムービー
            </button>
            <video
              ref={videoRef}
              className="hero-movie-video"
              src="videos/intro.mp4"
              controls
              preload="metadata"
            />
          </>
        )
      }

      /* ===== CycleDiagram（悪循環 / 好循環）縦フロー＋戻り線 ===== */
      const CycleDiagram = ({ steps, loop, tone }) => (
        <div className={'cycle cycle--' + tone}>
          <div className="cycle-track">
            <div className="cycle-rail" />
            <div className="cycle-list">
              {steps.map((s, i) => (
                <React.Fragment key={i}>
                  <div className="cycle-node">{s}</div>
                  {i < steps.length - 1 && (
                    <div className="cycle-down">
                      <i data-lucide="chevron-down" />
                    </div>
                  )}
                </React.Fragment>
              ))}
            </div>
          </div>
          <div className="cycle-caption">
            <i data-lucide={tone === 'good' ? 'rotate-cw' : 'rotate-ccw'} />
            {loop}
          </div>
        </div>
      )

      /* ===== BizDiagram（VACAN × 施設・店舗） =====
         上段は VACAN → 施設・店舗への提供価値、下段は逆向きの対価。SUWARO で増える分を hl で示す。 */
      const BizDiagram = () => (
        <div className="biz">
          <div className="biz-side">
            <div className="biz-ic">V</div>
            <span>VACAN</span>
          </div>
          <div className="biz-arrows">
            <div className="biz-flow">
              <span className="biz-flow-title">提供価値 →</span>
              <div className="biz-arrow to-right">
                <span className="lbl">混雑を見える化（従来）</span>
              </div>
              <div className="biz-arrow to-right hl">
                <span className="lbl">空席に送客（SUWARO で追加）</span>
              </div>
            </div>
            <div className="biz-flow biz-flow--pay">
              <span className="biz-flow-title">← 対価</span>
              <div className="biz-arrow to-left">
                <span className="lbl">月額 SaaS（従来）</span>
              </div>
              <div className="biz-arrow to-left hl">
                <span className="lbl">送客の成果報酬（SUWARO で追加）</span>
              </div>
            </div>
          </div>
          <div className="biz-side">
            <div className="biz-ic">☕</div>
            <span>施設・店舗</span>
          </div>
        </div>
      )

      /* ===== PositionMap（競合ポジショニング 2軸） ===== */
      const QUADRANTS = [
        { axis: '店が目的 × 表示', players: ['食べログ / Google Maps'] },
        { axis: '店が目的 × 割り当て', players: ['予約サービス（食べログ / ホットペッパー）'] },
        {
          axis: '席が目的 × 表示',
          players: ['VACAN Maps / Pages', 'いいオフィス / BizSPOT'],
          self: true,
        },
        { axis: '席が目的 × 割り当て', players: ['SUWARO'], target: true },
      ]

      const PositionMap = () => (
        <div className="posmap">
          <div className="posmap-yaxis">
            <span>店が目的</span>
            <i data-lucide="arrow-down" />
            <span>席が目的</span>
          </div>
          <div className="posmap-main">
            <div className="posmap-quads">
              {QUADRANTS.map((q, i) => (
                <div
                  className={
                    'posmap-quad' +
                    (q.target ? ' posmap-quad--target' : '') +
                    (q.self ? ' posmap-quad--self' : '')
                  }
                  key={i}
                >
                  <h4>{q.axis}</h4>
                  {q.players.map((name, j) => (
                    <span className="posmap-player" key={j}>
                      {name}
                    </span>
                  ))}
                </div>
              ))}
            </div>
            <div className="posmap-xaxis">
              <span>表示（全員に同じ情報）</span>
              <i data-lucide="arrow-right" />
              <span>割り当て（人ごとに違う席）</span>
            </div>
          </div>
        </div>
      )

      /* ===== ProfitLine（成功率と1送客あたりの粗利） =====
         数直線の左端を50%、右端を100%に取る。採算ライン67%を境に損益が反転する。 */
      const RATE_MIN = 50
      const RATE_MAX = 100
      const ratePos = (rate) => ((rate - RATE_MIN) / (RATE_MAX - RATE_MIN)) * 100

      const PROFIT_MARKS = [
        { rate: 67, profit: '±0円', note: '採算ライン', kind: 'even' },
        { rate: 80, profit: '+20円', note: '目標', kind: 'goal' },
        { rate: 90, profit: '+35円', note: '学習が進んだ状態', kind: 'good' },
      ]

      const ProfitLine = () => (
        <div className="pline-scroll">
          <div className="pline">
            <div
              className="pline-gap"
              style={{
                left: ratePos(67) + '%',
                width: ratePos(80) - ratePos(67) + '%',
              }}
            >
              <span>13ポイントの余裕</span>
            </div>
            <div className="pline-track">
              <div className="pline-zone pline-zone--loss" style={{ width: ratePos(67) + '%' }}>
                赤字
              </div>
              <div className="pline-zone pline-zone--gain">黒字</div>
            </div>
            {PROFIT_MARKS.map((m) => (
              <div
                className={'pline-mark pline-mark--' + m.kind}
                style={{ left: ratePos(m.rate) + '%' }}
                key={m.rate}
              >
                <span className="pline-profit">{m.profit}</span>
                <span className="pline-rate">{m.rate}%</span>
                <span className="pline-note">{m.note}</span>
              </div>
            ))}
            <div className="pline-ends">
              <span>成功率 {RATE_MIN}%</span>
              <span>{RATE_MAX}%</span>
            </div>
          </div>
        </div>
      )

      /* ===== MarketScope（TAM / SAM / SOM） =====
         円は包含関係を示すためのもので、面積比は金額に比例していない。 */
      const MARKET = [
        {
          key: 'TAM',
          amount: '約131億円',
          target: '全国の喫茶店・ハンバーガー店・ファミレス・コワーキング',
          count: '約73,000店',
        },
        {
          key: 'SAM',
          amount: '約27億円',
          target: '駅ナカ・駅周辺・商業施設など都市部',
          count: '約15,000店',
        },
        { key: 'SOM', amount: '約5.4億円', target: '5年で到達する', count: '3,000店' },
      ]

      const MarketScope = () => (
        <div className="scope">
          <div className="scope-circles">
            {MARKET.map((m) => (
              <div className={'scope-circle scope-circle--' + m.key.toLowerCase()} key={m.key}>
                <span className="scope-key">{m.key}</span>
                <span className="scope-amount">{m.amount}</span>
              </div>
            ))}
          </div>
          <ul className="scope-legend">
            {MARKET.map((m) => (
              <li key={m.key}>
                <span className={'scope-dot scope-dot--' + m.key.toLowerCase()} />
                <div>
                  <h4>{m.key}</h4>
                  <p>
                    {m.target}
                    <strong>{m.count}</strong>
                  </p>
                </div>
              </li>
            ))}
          </ul>
        </div>
      )

      /* ===== Section =====
         collapsible: 本編の8分では触れず、質疑で聞かれたときだけ開く付録に使う */
      const Section = ({ id, icon, label, title, alt, wide, collapsible, children }) => (
        <section className={'section' + (alt ? ' section--alt' : '')} id={id}>
          <div className={(wide ? 'section-wide' : 'section-inner') + ' reveal'}>
            {label && (
              <div className="section-label">
                <i data-lucide={icon} /> {label}
              </div>
            )}
            {collapsible ? (
              <details className="section-fold">
                <summary>
                  <h2>
                    {title}
                    <i data-lucide="chevron-down" />
                  </h2>
                </summary>
                <div className="section-fold-body">{children}</div>
              </details>
            ) : (
              <>
                {title && <h2>{title}</h2>}
                {children}
              </>
            )}
          </div>
        </section>
      )

      /* ===== Callout ===== */
      const Callout = ({ icon, type, children }) => (
        <div className={'callout callout--' + type}>
          <i data-lucide={icon} />
          <div>{children}</div>
        </div>
      )

      /* ===== InsightBox ===== */
      const InsightBox = ({ icon, children, style }) => (
        <div className="insight-box">
          {icon && <i data-lucide={icon} className="insight-box-icon" />}
          <p
            style={{
              fontSize: '1.05rem',
              fontWeight: 500,
              color: 'var(--white)',
              marginBottom: 0,
              ...style,
            }}
          >
            {children}
          </p>
        </div>
      )

      /* ===== Prototype ===== */
      const PHOTOS = [
        { img: 'images/cafe-1.jpg' },
        { img: 'images/cafe-2.jpg' },
        { img: 'images/cafe-3.jpg' },
      ]

      const Prototype = () => {
        const [screen, setScreen] = useState('home')
        const [selected, setSelected] = useState(2)
        const timerRef = useRef(null)

        const go = useCallback((s) => {
          if (timerRef.current) {
            clearTimeout(timerRef.current)
            timerRef.current = null
          }
          setScreen(s)
        }, [])

        const startSearch = useCallback(() => {
          go('search')
          timerRef.current = setTimeout(() => go('select'), 2500)
        }, [go])

        useEffect(
          () => () => {
            if (timerRef.current) clearTimeout(timerRef.current)
          },
          []
        )

        useLucide()

        const screenClass = (name) =>
          'proto-screen screen-' + name + (screen === name ? ' active' : '')

        return (
          <div className="proto-section">
            <div className="proto-text">
              <h3>体験してみてください</h3>
              <p>
                入力するのは<strong>人数だけ</strong>
                。届いた写真（最大3枚）から気になる1枚を選ぶと、お店までの案内が始まります。
              </p>
              <p>
                着いたら「座れましたか？」に答えて終わり。座れなかったときは、割引クーポンが出ます。
              </p>
              <div className="proto-hint">
                <i data-lucide="pointer" /> 画面をタップして操作できます
              </div>
            </div>

            <div className="phone">
              <div className="phone-dynamic-island" />
              <div className="phone-screen">
                <div className="phone-status">
                  <span>9:41</span>
                  <div className="phone-status-icons">
                    <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
                      <rect x="0" y="3" width="3" height="9" rx="1" opacity="0.3" />
                      <rect x="4.5" y="2" width="3" height="10" rx="1" opacity="0.5" />
                      <rect x="9" y="1" width="3" height="11" rx="1" opacity="0.7" />
                      <rect x="13.5" y="0" width="3" height="12" rx="1" />
                    </svg>
                    <svg width="16" height="12" viewBox="0 0 24 12" fill="currentColor">
                      <rect
                        x="0"
                        y="0"
                        width="22"
                        height="12"
                        rx="3"
                        stroke="currentColor"
                        strokeWidth="1.5"
                        fill="none"
                        opacity="0.4"
                      />
                      <rect x="23" y="3.5" width="2" height="5" rx="1" opacity="0.4" />
                      <rect x="2" y="2" width="16" height="8" rx="1.5" />
                    </svg>
                  </div>
                </div>
                <div className="phone-home-indicator" />

                {/* Home */}
                <div className={screenClass('home')}>
                  <div className="logo-mark">S</div>
                  <h2>SUWARO</h2>
                  <p className="tagline">座りたい場所を見つけよう</p>
                  <div className="location">
                    <i data-lucide="map-pin" /> 新宿駅付近
                  </div>
                  <button className="btn-proto" onClick={() => go('count')}>
                    <i data-lucide="search" /> 空席を探す
                  </button>
                </div>

                {/* Count */}
                <div className={screenClass('count')}>
                  <h2>何名ですか？</h2>
                  <div className="count-grid">
                    {[1, 2, 3, '4+'].map((n, i) => (
                      <button
                        key={i}
                        className={'count-btn' + (selected === i + 1 ? ' selected' : '')}
                        onClick={() => setSelected(i + 1)}
                      >
                        {n}
                      </button>
                    ))}
                  </div>
                  <button className="btn-proto" onClick={startSearch}>
                    この人数で探す
                  </button>
                </div>

                {/* Searching */}
                <div className={screenClass('search')}>
                  <div className="search-pulse">
                    <i data-lucide="search" />
                  </div>
                  <p>空いている席を探しています...</p>
                  <p className="search-sub">周辺の空き状況を分析中</p>
                </div>

                {/* Select — 写真だけ・最大3件（店名/地図/評価なし） */}
                <div className={screenClass('select')}>
                  <div className="select-badge">
                    <i data-lucide="sparkles" /> 近くで空いてる3つ
                  </div>
                  <p className="select-hint">気になる雰囲気を、ひとつ選んでください</p>
                  <div className="photo-stack">
                    {PHOTOS.map((p, i) => (
                      <button
                        key={i}
                        className="photo-card"
                        style={{ backgroundImage: `url(${p.img})` }}
                        onClick={() => go('nav')}
                        aria-label={'候補 ' + (i + 1)}
                      />
                    ))}
                  </div>
                </div>

                {/* Nav — 経路案内（選んだ後に店名を開示） */}
                <div className={screenClass('nav')}>
                  <div className="nav-map">
                    <svg className="nav-svg" viewBox="0 0 300 210" preserveAspectRatio="none">
                      <path
                        className="nav-path-bg"
                        d="M38 182 C 90 182, 92 96, 152 96 S 232 44, 264 32"
                      />
                      <path
                        className="nav-path-fg"
                        d="M38 182 C 90 182, 92 96, 152 96 S 232 44, 264 32"
                      />
                    </svg>
                    <div className="nav-pin nav-pin--start" />
                    <div className="nav-pin nav-pin--end">
                      <i data-lucide="coffee" />
                    </div>
                  </div>
                  <div className="nav-card">
                    <div className="nav-eta">
                      <span className="nav-eta-num">4</span>
                      <span className="nav-eta-unit">分</span>
                    </div>
                    <div className="nav-dest-info">
                      <span className="nav-reveal-tag">
                        <i data-lucide="eye" /> 選んだので店名を開示
                      </span>
                      <h3>CAFÉ MORINO</h3>
                      <p>
                        <i data-lucide="navigation-2" /> 280m 先・まっすぐ進んで右
                      </p>
                    </div>
                  </div>
                  <button className="btn-proto" onClick={() => go('feedback')}>
                    <i data-lucide="flag" /> 到着した
                  </button>
                </div>

                {/* Feedback */}
                <div className={screenClass('feedback')}>
                  <h2>座れましたか？</h2>
                  <p className="sub">CAFÉ MORINO での結果を教えてください</p>
                  <div className="feedback-btns">
                    <button
                      className="feedback-btn feedback-btn--yes"
                      onClick={() => go('success')}
                    >
                      ✓ 座れた
                    </button>
                    <button className="feedback-btn feedback-btn--no" onClick={() => go('qr')}>
                      ✗ 座れなかった
                    </button>
                  </div>
                </div>

                {/* Success */}
                <div className={screenClass('success')}>
                  <div className="success-check">
                    <i data-lucide="check" />
                  </div>
                  <h2>ありがとうございます！</h2>
                  <p>このデータが次の改善に活きます</p>
                  <button className="btn-proto--ghost" onClick={() => go('home')}>
                    ホームに戻る
                  </button>
                </div>

                {/* QR Scan */}
                <div className={screenClass('qr')}>
                  <h2>来店証明</h2>
                  <p>
                    店舗に設置された QR コードを
                    <br />
                    スキャンしてください
                  </p>
                  <div className="qr-viewfinder">
                    <i data-lucide="scan" />
                    <div className="qr-scanning-line" />
                  </div>
                  <button className="btn-proto" onClick={() => go('coupon')}>
                    <i data-lucide="check" /> スキャン完了
                  </button>
                </div>

                {/* Coupon */}
                <div className={screenClass('coupon')}>
                  <h2>申し訳ありません</h2>
                  <p>お詫びにクーポンをお送りします</p>
                  <div className="coupon-card">
                    <i data-lucide="gift" />
                    <h3>次回 100円 割引クーポン</h3>
                    <p>SUWARO が次に案内するお店で使えます</p>
                  </div>
                  <button className="btn-proto--ghost" onClick={() => go('home')}>
                    ホームに戻る
                  </button>
                </div>
              </div>
            </div>
          </div>
        )
      }

      /* ===== App ===== */
      const App = () => {
        useLucide()
        useScrollReveal()

        return (
          <>
            {/* Navigation */}
            <nav className="nav">
              <div className="nav-inner">
                <div className="nav-logo">
                  <i data-lucide="armchair" /> SUWARO
                </div>
                <div className="nav-links">
                  <a href="#problem">課題</a>
                  <a href="#solution">解決策</a>
                  <a href="#prototype">プロトタイプ</a>
                  <a href="#customer">最初の顧客</a>
                  <a href="#revenue">売上</a>
                  <a href="#strength">強み</a>
                  <a href="#positioning">付録</a>
                </div>
              </div>
            </nav>

            {/* Hero */}
            <header className="hero">
              <div className="hero-inner">
                <div className="hero-badge">VACAN DX Innovation Award 2026</div>
                <h1>
                  <i data-lucide="armchair" /> SUWARO
                </h1>
                <div className="hero-sub">スワロ</div>
                <p className="hero-tagline">
                  「座れる場所」が、
                  <br />
                  すぐに見つかる。
                </p>
                <ConceptMovieButton />
                <div className="hero-meta">
                  <img className="avatar" src="images/avatar.png" alt="" width="32" height="32" />
                  <span>Shungo Nagamachi</span>
                </div>
              </div>
            </header>

            {/* 1. 課題 */}
            <Section id="problem" icon="alert-triangle" label="PROBLEM" title="課題">
              <p>
                駅で「少し座りたいね」となっても、目立つ店はどこも混んでいそうで、どっちに歩けばいいか分からない。地図で「カフェ」と検索すれば候補は大量に出るが、多すぎて逆に決められない。結局、いちばん目立つ店の行列に並ぶ。
              </p>
              <p>
                「バカンで働いている」と話すと、友人からも「カフェの席がないの、なんとかしてよ」と言われる。困っているのは自分だけではない。
              </p>

              <Figure
                src="images/problem-lost.jpg"
                alt="スマホを見ながら、駅前に並ぶカフェのどこに入るか決められないユーザー"
                caption="候補はたくさん出る。でも「どこに向かうか」は決まらない"
              />

              <p>
                ただ、どこも満席なわけではない。混んでいるのは大通りやチェーンなど目立つ店で、席の埋まり方は平準化されていない。
              </p>

              <Callout icon="info" type="info">
                この場面での目的は「行きたいお店に入ること」ではなく「座って休めること」。
                <br />
                <strong>店は目的ではなく手段。条件さえ満たせば、互いに代わりになる。</strong>
              </Callout>
            </Section>

            {/* 2. なぜ表示では解決しないか */}
            <Section icon="eye" label="INSIGHT" title="なぜ「空席を表示する」では解決しないか" alt>
              <p>
                空席を表示しても、見た人みんなが同じ店に向かえば、すぐに埋まる。席が3つの店を100人が見れば、座れるのは3人で、残りの97人は無駄足になる。空席の情報は
                <strong>見る人が増えるほど価値が薄まる構造</strong>となっている。
              </p>

              <CycleDiagram
                tone="bad"
                loop="見た人が多いほど、無駄足も増える"
                steps={[
                  '「空いている」と表示される',
                  '見た人が同じ店へ向かう',
                  '座れるのは最初の数人',
                  '残りは無駄足。表示は「混雑」に変わる',
                  '次に「空いている」店でも同じことが起きる',
                ]}
              />

              <Callout icon="alert-triangle" type="warn">
                既存の VACAN Maps, Pages の混雑表示もこの構造の中にいる。
                <br />
                情報を出すこと自体には価値があるが、その価値は
                <strong>利用者が増えるほど一人あたりで薄まっていく</strong>。
              </Callout>
            </Section>

            {/* 3. 解決策 */}
            <Section
              id="solution"
              icon="shuffle"
              label="SOLUTION"
              title="解決策：表示から割り当てへ"
            >
              <p>
                情報の価値を保つには、全員に同じものを見せないこと。人によって違う空席を渡せば、同じ席を奪い合わずに済む。これが「表示」ではなく「割り当て」に変える理由。
              </p>
              <p>
                ユーザーは自分で店を探し回らない。プラットフォームが探索を肩代わりし、絞り込んだ候補だけを差し出す。
              </p>

              <Figure
                src="images/concept-allocation.jpg"
                alt="スマホの案内の先で、扉を開けて待っている1軒のカフェ"
                caption="探し回らせない。行き先はプラットフォームが絞る"
              />

              <h3>3つの原則</h3>
              <div className="principles">
                {[
                  {
                    title: '見せるのは写真だけ',
                    desc: '店名・評価・地図・距離などの"比較材料"を隠す。「どこにする？」が直感で決まる',
                  },
                  {
                    title: '最大3件・排他的に割り当て',
                    desc: '大量の候補で迷わせない。人によって違う店を渡すので、同じ席に人が集中しない',
                  },
                  {
                    title: '外したら補償する',
                    desc: '予約ではないので席は押さえられない。座れなかったら、来店を確認して割引クーポンを出す',
                  },
                ].map((p, i) => (
                  <div className="principle" key={i}>
                    <div className="principle-num">{i + 1}</div>
                    <h4>{p.title}</h4>
                    <p>{p.desc}</p>
                  </div>
                ))}
              </div>

              <Callout icon="hand" type="info">
                肝は
                <strong>選択肢と情報を絞りながら、決定はユーザーに残す</strong>
                こと。候補が多すぎる「決定疲れ」と、1件固定で"決めつけられる"「押し付け」の、ちょうど中間を狙う。
              </Callout>
            </Section>

            {/* Prototype */}
            <Section
              id="prototype"
              icon="smartphone"
              label="PROTOTYPE"
              title="プロトタイプ"
              alt
              wide
            >
              <Prototype />
            </Section>

            {/* 4. 最初の顧客 */}
            <Section id="customer" icon="store" label="FIRST CUSTOMER" title="最初の顧客">
              <p>
                ここからは事業の話。最初に狙うのは、VACAN のカメラがすでに入っている
                <strong>駅ナカの商業施設</strong>
                。VACAN
                との契約がすでにあり、1契約で施設内の店をまとめて迎えられるので、導入までの対応コストが低い。
              </p>
              <p>
                初期ユーザーも施設の中で集める。館内の VACAN サイネージから QR
                経由で、インストールなしで開ける導線を作る。常連を育てなくても、
                <strong>その日座れなかった来館者が1回使えば送客になる</strong>。
              </p>

              <h3>なぜ50円なら払うのか</h3>
              <p>
                施設内の飲食テナントへの送客に対して、<strong>1送客50円</strong>
                の成果報酬を払ってもらう。
              </p>
              <p>
                カフェの客単価を700円、原価率を3割とすると、空席がひとつ埋まったときに店に残る限界利益は約500円。
                <strong>その1割</strong>
                を送客単価に置いた。月300送客なら支払いは15,000円で、埋まった空席から約15万円が戻る。
                <strong>払った額が10倍になって返ってくる</strong>
                計算なので、払う理由を数字で示せる。
              </p>

              <h3>その単価で、プラットフォームは儲かるか</h3>
              <p>
                送客が成功すれば +50円、空振りすればクーポン原価 −100円。1送客あたりの粗利は
                <code>50r − 100(1−r)</code>（r は成功率）で表せる。
              </p>
              <ProfitLine />
              <Callout icon="shield-check" type="info">
                目標の8割は、5回に1回の空振りまでなら使い続けてもらえる、という
                <strong>体験側から決めた線</strong>
                。採算ラインより13ポイント高く、精度が一時的に落ちても事業が壊れない。
              </Callout>
            </Section>

            {/* 5. 5年後の売上 */}
            <Section
              id="revenue"
              icon="bar-chart-3"
              label="REVENUE"
              title="5年後の売上：約5.4億円"
              alt
            >
              <p>
                1店あたりの送客手数料は、1日10送客・月300送客として<strong>年18万円</strong>。
                <strong>3,000店 × 年18万円 ＝ 約5.4億円</strong>が、5年後の売上目標。
              </p>

              <div className="roadmap">
                {[
                  { num: '0', title: 'POC', desc: '1施設・10〜20店で、カメラ起点の割り当てを検証' },
                  {
                    num: '1',
                    title: '施設で確立',
                    desc: 'カメラ導入済みの駅・商業施設へ（約100店）',
                  },
                  {
                    num: '3年',
                    title: '施設を広げる',
                    desc: 'カメラの導入営業とセットで施設を増やす（1,000店）',
                  },
                  {
                    num: '5年',
                    title: '駅周辺へ',
                    desc: '1タップ申告で、カメラのない個人店・他業態へ（3,000店）',
                  },
                ].map((step, i) => (
                  <div className="roadmap-step" key={i}>
                    <div className="roadmap-dot">{step.num}</div>
                    <h4>{step.title}</h4>
                    <p>{step.desc}</p>
                  </div>
                ))}
              </div>
              <p>
                5年目に広げる個人店すべてにカメラを置くのは現実的でない。そこで、管理画面から「今すぐ座れる」を1タップで申告できるようにして、参加のハードルを下げる。
              </p>

              <h3>市場規模</h3>
              <p>
                カフェ市場そのもの（約1兆円）は分母にしない。SUWARO
                の収益は飲食売上ではなく送客手数料なので、「ゆっくり座れる」店の数から積み上げる。
              </p>
              <MarketScope />
              <Callout icon="flag" type="info">
                3,000店は、都市部の「座れる」店の約2割。業態を広げても SAM
                は約15,000店にとどまるので、店数だけで10億円を描くことはしない。その先は送客単価の上昇と、店の入札で送客枠を配分するオークション型の課金が伸びしろになる。
              </Callout>

              <h3>既存のカメラ事業も押し上げる</h3>
              <p>
                5.4億円とは別に、SUWARO は VACAN
                のカメラ事業そのものを強くする。「混雑を表示できます」が「空いている時間にお客さんを送り込めます」に変わり、カメラ導入の
                ROI が上がる。
                <strong>新規導入を通しやすくし、既存契約の解約を止める</strong>
                材料になる。
              </p>
              <BizDiagram />
            </Section>

            {/* 6. 強み */}
            <Section id="strength" icon="castle" label="STRENGTH" title="広まるほど、座れる">
              <p>割り当てモデルは、店とユーザーが増えるほど予測が当たり、座れる確率が上がる。</p>

              <h3>AI が担うのは2つ</h3>
              <ul className="check-list">
                {[
                  '5〜10分後の空席予測：「今の空き」ではなく、着いたときの空きを当てる',
                  '割り当ての最適化：誰にどの3件を渡せば、全員が座れる確率が最も高くなるか',
                ].map((item, i) => (
                  <li key={i}>
                    <i data-lucide="check" />
                    {item}
                  </li>
                ))}
              </ul>

              <h3>強くなる仕組みは3層</h3>
              <div className="principles">
                {[
                  {
                    title: 'カメラ網',
                    desc: '駅・商業施設にすでにある在庫センサー。後発がすぐには作れない、最初の優位',
                  },
                  {
                    title: '正解データ',
                    desc: '割り当てると「座れた／座れなかった」が必ず返る。この正解データが蓄積し、空振りも学習材料になる',
                  },
                  {
                    title: 'ネットワーク効果（店・ユーザー）',
                    desc: '店が増えるほど選択肢が増えて当たりやすくなり、ユーザーが増え、さらに店が増える',
                  },
                ].map((p, i) => (
                  <div className="principle" key={i}>
                    <div className="principle-num">{i + 1}</div>
                    <h4>{p.title}</h4>
                    <p>{p.desc}</p>
                  </div>
                ))}
              </div>

              <CycleDiagram
                tone="good"
                loop="一周ごとに予測精度の差が開く（データフライホイール）"
                steps={[
                  '割り当てる',
                  '成功／失敗が溜まる',
                  '当たる確率が上がる',
                  'ユーザーが増える',
                  '送客が増え、店も増える',
                ]}
              />
            </Section>

            {/* 7. なぜ自分か */}
            <Section icon="user" label="WHY ME" title="なぜ自分がやるのか" alt>
              <InsightBox
                icon="send"
                style={{
                  fontSize: '1.1rem',
                  fontWeight: 700,
                  textAlign: 'center',
                }}
              >
                混雑情報というアウトプットを作ってきた。次は、「座れる」というアウトカムを届けたい。
              </InsightBox>
              <p>SUWARO に必要な3つを、すべて経験してきた。</p>
              <ul className="check-list">
                {[
                  'プラットフォーム：大学でプラットフォームビジネスを研究していた',
                  '混雑状況の基盤：入社から3年、vCore を開発してきた',
                  'AI 時代のプロダクト開発：直近の2年、防災チームで AI 活用をリードしてきた',
                ].map((item, i) => (
                  <li key={i}>
                    <i data-lucide="check" />
                    {item}
                  </li>
                ))}
              </ul>
            </Section>

            {/* 付録：競合とポジショニング */}
            <Section
              id="positioning"
              icon="crosshair"
              label="APPENDIX · POSITIONING"
              title="競合とポジショニング"
              collapsible
            >
              <p>
                「座る場所を探す」サービスは多いが、
                <strong>空いている席を一人ずつに割り当てる</strong>
                プレイヤーはいない。横軸は情報の配り方、縦軸はユーザーの目的。
              </p>

              <PositionMap />

              <h3>なぜ右下が空いているのか</h3>
              <p>
                予約サービスは席を押さえられるが、滞在が短く客単価も低いカフェでは、1件ずつ管理するコストが見合わない。予約ほど重くなく、表示より確実な手段が、まだない。
              </p>
            </Section>

            {/* 付録：リスクと検証 */}
            <Section
              icon="shield-alert"
              label="APPENDIX · RISKS"
              title="リスクと検証"
              alt
              collapsible
            >
              <table className="styled-table">
                <thead>
                  <tr>
                    <th>リスク</th>
                    <th>対策</th>
                  </tr>
                </thead>
                <tbody>
                  {[
                    {
                      risk: 'ピーク時には目立たない店まで埋まり、割り当てる空席がない',
                      action: 'POC の前に、設置済みカメラのデータでピーク時の空席の偏りを確かめる',
                    },
                    {
                      risk: 'プロダクトが利用されず、送客数が伸びない',
                      action: 'POC で、来館者のうち使った人の割合を主要指標にする',
                    },
                    {
                      risk: '割り当ての精度が出ず、補償コストが膨らむ',
                      action:
                        '採算ライン67%に対し目標は8割。補償は QR 来店証明とユーザー単位の上限で抑える',
                    },
                  ].map((r, i) => (
                    <tr key={i}>
                      <td>{r.risk}</td>
                      <td>{r.action}</td>
                    </tr>
                  ))}
                </tbody>
              </table>

              <div className="validation-box">
                <h3>
                  <i data-lucide="flask-conical" /> POC：本当に座れるかを確かめる
                </h3>
                <ul className="check-list">
                  {[
                    'VACAN カメラ設置済みの1施設・10〜20店舗で2週間。追加の設備投資は不要',
                    '割り当て成功率・利用率を記録する',
                  ].map((item, i) => (
                    <li key={i}>
                      <i data-lucide="check" />
                      {item}
                    </li>
                  ))}
                </ul>
              </div>
            </Section>

            {/* Footer */}
            <footer className="footer">
              <p>VACAN DX Innovation Award 2026 — Shungo Nagamachi</p>
            </footer>
          </>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
